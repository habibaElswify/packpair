# Render deployment for the PackPair solver microservice (the AI brain).
# Habiba: create a new "Blueprint" service from this repo, or a Web Service
# pointing at this file. The free tier is fine (≈30s cold start).
services:
  - type: web
    name: packpair-solver
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Comma-separated front-end origins allowed to call the API.
      # Set this to your Vercel URL once the front-end is deployed.
      - key: PACKPAIR_CORS_ORIGINS
        sync: false
